<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JAGA Stok</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
:root{--navy:#14284b;--gold:#e9a820;--bg:#fbf6ea;--card:#fff;--ink:#1c2233;--mut:#6b7285;--line:#e8e0cc;--head:#14284b;--ok:#1f8a4c;--bad:#c93a3a;--warn:#d9731a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--card:#1b2538;--ink:#eef1f7;--mut:#9aa4b8;--line:#2b3750;--head:#f3d27a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111827;--card:#1b2538;--ink:#eef1f7;--mut:#9aa4b8;--line:#2b3750;--head:#f3d27a;color-scheme:dark}
html{font-size:15px;scroll-padding-top:env(safe-area-inset-top,0px)}html.big{font-size:17.5px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.45 Inter,system-ui,sans-serif;padding-bottom:84px}
h1,h2,h3,button,.n{font-family:Poppins,Inter,sans-serif}h2{font-size:1.35rem;margin:.4rem 0 .6rem;color:var(--head)}h3{font-size:1.1rem;margin:.2rem 0;color:var(--head)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}header b{font-family:Poppins;font-size:1.05rem}header span{font-size:.8rem;opacity:.85;text-align:right}
main{padding:14px 14px 20px;max-width:640px;margin:auto}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 10px;border:1px solid var(--line);border-left:5px solid var(--line)}
.m{color:var(--mut);font-size:.85rem;margin:.15rem 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
button{font-size:1rem;min-height:48px;border-radius:999px;border:2px solid var(--navy);background:transparent;color:var(--head);padding:0 18px;font-weight:700;cursor:pointer}
button.p{background:var(--gold);border-color:var(--gold);color:var(--navy)}button.w{width:100%}button.s{min-height:36px;font-size:.85rem;padding:0 12px}button.d{border-color:var(--bad);color:var(--bad)}
input,select{font:inherit;width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;margin:4px 0 8px}
input[type=radio],input[type=checkbox]{width:auto;min-height:0;margin:0 8px 0 0}label{display:block;font-size:.85rem;font-weight:500;color:var(--mut)}label.c{display:flex;align-items:center;color:var(--ink);margin:6px 0}
.chip{display:inline-block;font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px;background:#eee;color:#444}
.c-Draf{background:#e6e8ee;color:#444}.c-Dikirim{background:#d9e8fb;color:#1f4f99}.c-Dikembalikan{background:#fde6d0;color:#a4510a}.c-Terkunci{background:#d4f0de;color:#13683a}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--navy);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;color:#cdd6ea;min-height:46px;padding:0 2px;font-size:.78rem;border-radius:12px}.nav button.on{background:var(--gold);color:var(--navy)}
.ov{position:fixed;inset:0;background:#0008;z-index:5}.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:6;max-width:640px;margin:auto}
.qty{display:flex;gap:8px;align-items:center}.qty button{min-width:52px;padding:0}.qty input{text-align:center;font:700 1.7rem Poppins;height:56px}
.th{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin:6px 0}.pv{background:#e3f3e8;color:#13683a;border-radius:10px;padding:6px 10px;font-size:.85rem}.pv:empty{display:none}
table{width:100%;border-collapse:collapse;font-size:.82rem}td,th{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}.wrap{overflow-x:auto}
.pos{color:var(--ok)}.neg{color:var(--bad)}#t{position:fixed;left:12px;right:12px;bottom:90px;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;z-index:9;display:none;justify-content:space-between;align-items:center}#t button{min-height:32px;color:var(--gold);border-color:var(--gold);font-size:.8rem}
video{width:100%;border-radius:14px;border:3px solid var(--gold);margin:6px 0}.stk{background:#fff;color:#000;border:1px dashed #888;border-radius:6px;padding:8px;text-align:center;width:260px;margin:8px auto}.stk svg{max-width:100%}
@media print{header,main>*:not(#sh),.nav,.ov,.sheet button,#t{display:none!important}.sheet{position:static!important}}
</style></head><body>
<header><b>JAGA Stok</b><span><span id="who"></span><br><small id="sy"></small></span></header>
<main id="app"></main><div id="sh"></div><div id="t"></div><nav class="nav" id="nav"></nav>
<script>
const K='sppg_opname_v1',$=s=>document.querySelector(s),J=a=>a.join(''),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
S=S||{items:[],ses:{},mv:[],log:[],n:{BHN:0,BRG:0},big:0,uid:''};S.h=S.h||{};S.since=S.since||0;S.api=S.api||'';S.api='gas';S.cid='gas';S.tok=S.tok||'';
let st;const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){toast('Penyimpanan penuh, hapus foto lama')}clearTimeout(st);st=setTimeout(sync,800)};
const D={persiapan:['Persiapan Bahan Baku','#2e9e5b'],pengolahan:['Pengolahan','#e8833a'],pemorsian:['Pemorsian','#8a5cc7'],cuci:['Cuci Ompreng','#1fa6b8'],kebersihan:['Kebersihan','#d9568a']};
const U=[['aiman','Aiman','Asisten Lapangan','asisten'],['yeyen','Yeyen Uliyatul Halim','Admin Stok','admin'],['manisem','Manisem','Koordinator Persiapan Bahan Baku','div','persiapan'],['juliana','Juliana Putri','Koordinator Pengolahan','div','pengolahan'],['maesyana','Maesyana Wulam','Koordinator Pemorsian','div','pemorsian'],['komalasari','Komalasari','Koordinator Cuci Ompreng','div','cuci'],['zaki','Nur Muhammad Muzaki','Koordinator Kebersihan','div','kebersihan'],['devina','Devina','Pengawas Keuangan','keu'],['vitri','Vitri Heriana Juniar','Pengawas Gizi','gizi'],['salman','Salman Alfarisi','Kepala SPPG','kepala']].map(a=>({id:a[0],nama:a[1],jab:a[2],r:a[3],d:a[4]}));
const T={div:['beranda','hitung','laporan','akun'],asisten:['beranda','tinjau','laporan','akun'],admin:['beranda','master','stok','laporan','akun'],keu:['beranda','tinjau','laporan','akun'],gizi:['beranda','tinjau','laporan','akun'],kepala:['beranda','tinjau','laporan','akun']};
const TL={beranda:'Beranda',hitung:'Hitung',tinjau:'Tinjau',master:'Master',stok:'Stok',laporan:'Laporan',akun:'Akun'};
const LOK=['Gudang Kering','Gudang Basah'],DEC=['kg','liter','l','gram'];
const V={u:S.me||U.find(x=>x.id===S.uid),tab:'beranda',lok:LOK[0],q:'',sheet:'',cur:{},rd:new Date().toLocaleDateString('sv')};
const today=()=>new Date().toLocaleDateString('sv'),own=()=>V.u.d||V.u.r,it=id=>S.items.find(i=>i.id===id);
const lastId=(t,o,l)=>{const b=t+'|'+o+'|'+l;let n=1;while(S.ses[b+'|'+(n+1)])n++;return n>1?b+'|'+n:b},sidOf=l=>lastId(today(),own(),l),sf=s=>{const p=s.id.split('|')[3];return p?' · susulan '+p:''},F=(i,u)=>u===i.dasar?1:(i.units[u]||1),fmt=n=>n==null?'—':String(Math.round(n*100)/100);
const getS=c=>{const id=sidOf(V.lok);let s=S.ses[id];if(!s&&c)s=S.ses[id]={id,tgl:today(),own:own(),lok:V.lok,st:'Draf',rows:{},by:V.u.id,byr:V.u.r,byn:V.u.nama};return s};
const scope=()=>S.items.filter(i=>i.aktif&&(!V.u.d||!i.divisi.length||i.divisi.includes(V.u.d)));
const col=o=>(D[o]||['','#14284b'])[1],dn=o=>D[o]?D[o][0]:o==='asisten'?'Asisten Lapangan':'Admin Stok';
const chip=st=>`<span class="chip c-${st}">${st}</span>`;
const log=(ref,lama,baru,al)=>S.log.unshift({id:'L'+Date.now()+Math.random().toString(36).slice(2,5),t:new Date().toLocaleString('id-ID'),u:V.u.nama,ref,lama,baru,al:al||''});
const sel=(s,id)=>{const r=s.rows[id];if(s.st==='Terkunci')return r.sel;const i=it(id);return i.stok==null?null:r.d-i.stok};
const sc=n=>n==null?'—':`<span class="${n<0?'neg':n>0?'pos':''}">${n>0?'+':''}${fmt(n)}</span>`;
let tt;function toast(m,undo){const t=$('#t');t.innerHTML=`<span>${e(m)}</span>${undo?'<button data-a="undo">Batalkan</button>':''}`;t.style.display='flex';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',5000)}
async function cmp(f){const b=await createImageBitmap(f),k=Math.min(1,480/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
const alt=s=>Object.fromEntries(s.split(',').map(x=>x.split('=').map(y=>y.trim())).filter(x=>x[0]&&+x[1]>0).map(x=>[x[0],+x[1]]));
function mk(o){const p=o.jenis==='bahan'?'BHN':'BRG',k=p+'-'+String(1+Math.max(0,...S.items.filter(i=>i.kode.startsWith(p)).map(i=>+i.kode.slice(4)))).padStart(4,'0');S.items.push({id:k,kode:k,bc:[],foto:'',stok:null,last:0,aktif:true,...o});return k}

/* ---------- Tampilan ---------- */
function render(){document.documentElement.classList.toggle('big',!!S.big);const u=V.u;
 if(!u){$('#who').textContent='';$('#nav').innerHTML='';$('#app').innerHTML=S.api&&S.cid?glogin():`<h2>Masuk sebagai</h2><p class="m">Pilih akun. Data tersimpan di ponsel ini dan tetap bisa dipakai tanpa internet.</p>${conn()}${J(U.map(x=>`<div class="card" style="border-left-color:${col(x.d)}"><div class="row"><div><b>${e(x.nama)}</b><div class="m">${x.jab}</div></div><button class="s p" data-a="login" data-v="${x.id}">Masuk</button></div></div>`))}`;return}
 $('#who').innerHTML=`${e(u.nama)}<br>${u.jab}`;const tabs=T[u.r];
 $('#nav').innerHTML=J(tabs.map(t=>`<button class="${V.tab===t?'on':''}" data-a="tab" data-v="${t}">${TL[t]}</button>`));
 $('#app').innerHTML=({beranda,hitung,tinjau,master,stok,laporan,akun})[V.tab]();$('#sh').innerHTML=V.sheet?`<div class="ov" data-a="x"></div><div class="sheet">${V.sheet}</div>`:'';
 if(V.sheet&&V.cur.bc&&window.JsBarcode){try{JsBarcode('#bcs',V.cur.bc,{format:'CODE128',height:44,fontSize:13,margin:2})}catch(x){}}}
const canCount=()=>['div','asisten','admin'].includes(V.u.r);
function beranda(){const u=V.u;let h=`<h2>Halo, ${e(u.nama.split(' ')[0])}</h2>`;
 if(canCount()){const N=scope().length;h+=J(LOK.map(l=>{const s=S.ses[sidOf(l)],n=s?Object.keys(s.rows).length:0;return`<div class="card" style="border-left-color:${col(own())}"><div class="row"><b>${l}</b>${chip(s?s.st:'Draf')}</div><div class="m">${dn(own())} · ${today()}</div><div class="row"><span class="n" style="font-size:1.4rem">${n}<small class="m">/${N} item</small></span><button class="s p" data-a="go" data-v="${l}">${n?'Lanjutkan':'Mulai'} hitung</button></div></div>`}));
  if(!N)h+='<p class="m">Belum ada item di cakupan akun ini. Minta Admin Stok mendaftarkan item.</p>'}
 if(['asisten','kepala','keu','gizi'].includes(u.r)){h+='<h3>Progres hari ini</h3>';h+=J(Object.keys(D).map(d=>`<div class="card" style="border-left-color:${col(d)}"><b>${D[d][0]}</b>${J(LOK.map(l=>{const s=S.ses[lastId(today(),d,l)];return`<div class="row m"><span>${l}</span>${s?chip(s.st):'<span>Belum mulai</span>'}</div>`}))}</div>`));
  const q=Object.values(S.ses).filter(s=>s.st==='Dikirim').length;h+=`<div class="card"><b>${q}</b> sesi menunggu persetujuan <button class="s p" style="float:right" data-a="tab" data-v="tinjau">Buka Tinjau</button></div>`}
 if(u.r==='admin'){const pk=S.items.filter(i=>i.stok!=null&&!S.mv.some(m=>m.id===i.id&&m.type==='pakai'&&m.t===today())).length;h+=`<div class="card"><b>${S.items.length}</b> item terdaftar<br><b>${pk}</b> item belum dicatat pemakaiannya hari ini</div><button class="w p" data-a="tab" data-v="master">Daftarkan item baru</button>`;if(!S.items.length)h+='<p class="m">Daftar masih kosong. Mulai dari menu Master, atau muat data contoh di menu Akun.</p>'}
 return h}
function hitung(){const s=getS(),ed=!s||['Draf','Dikembalikan'].includes(s.st)||(s.st==='Dikirim'&&V.u.r==='asisten'),rows=s?Object.keys(s.rows):[];
 return`<h2>Hitung stok</h2><div class="row" style="gap:6px">${J(LOK.map(l=>`<button class="s ${V.lok===l?'p':''}" data-a="go" data-v="${l}" style="flex:1">${l}</button>`))}</div><p class="m">${dn(own())} · ${today()}${s?sf(s):''} ${s?chip(s.st):''}</p>
 ${s&&s.cat?`<div class="card" style="border-left-color:var(--warn)"><b>Dikembalikan:</b> ${e(s.cat)}</div>`:''}
 ${ed?`<div class="row" style="gap:8px"><button class="p" style="flex:1" data-a="scan">Scan barcode</button></div><video id="cam" hidden playsinline muted></video><input id="qs" placeholder="Cari nama atau ketik kode, lalu Enter" value="${e(V.q)}" autocomplete="off"><div id="res">${res()}</div>`:(s.st==='Terkunci'&&canCount()?'<p class="m">Sesi ini sudah disetujui dan dikunci. Item yang belum dihitung bisa dicatat lewat sesi susulan.</p><button class="w p" data-a="susulan">Tambah hitungan susulan</button>':'<p class="m">Sesi ini tidak dapat diubah.</p>')}
 <h3>Sudah dihitung (${rows.length}/${scope().length})</h3>${rows.length?J(rows.map(id=>{const i=it(id),r=s.rows[id];return`<div class="card"><div class="row"><div><b>${e(i.nama)}</b><div class="m">${r.q} ${r.u}${r.u!==i.dasar?` = ${fmt(r.d)} ${i.dasar}`:''} · selisih ${sc(sel(s,id))}</div></div>${ed?`<button class="s" data-a="open" data-v="${id}">Edit</button>`:''}</div></div>`})):'<p class="m">Belum ada. Scan barcode atau cari item untuk mulai.</p>'}
 ${s&&['Draf','Dikembalikan'].includes(s.st)&&rows.length?'<button class="w p" data-a="send">Kirim sesi</button>':''}`}
function res(){const q=V.q.toLowerCase().trim();if(!q)return'';const r=scope().filter(i=>(i.nama+i.kode+i.bc.join()).toLowerCase().includes(q)).slice(0,8);return r.length?J(r.map(i=>`<div class="card" data-a="open" data-v="${i.id}"><b>${e(i.nama)}</b><div class="m">${i.kode} · stok sistem ${fmt(i.stok)} ${i.dasar}</div></div>`)):'<p class="m">Tidak ditemukan. Minta Admin Stok mendaftarkan item ini.</p>'}
function openItem(id,met){const i=it(id),s=getS(1);if(s.st==='Terkunci')return;const r=s.rows[id],post=s.st==='Dikirim';V.cur={id,foto:r?r.foto:'',met:r?r.met:met};
 V.sheet=`<h3>${e(i.nama)}</h3><p class="m">${i.kode} · stok sistem ${fmt(i.stok)} ${i.dasar}</p>${i.foto?`<img class="th" src="${i.foto}">`:''}
 <div class="qty"><button data-a="step" data-v="-1">−</button><input id="q" type="number" inputmode="decimal" min="0" step="any" value="${r?r.q:''}" placeholder="0"><button data-a="step" data-v="1">+</button></div>
 <label>Satuan<select id="u" data-c="unit">${J([i.dasar,...Object.keys(i.units)].map(x=>`<option ${r&&r.u===x?'selected':''}>${x}</option>`))}</select></label>
 ${r?'<label class="c"><input type="radio" name="md" value="salah" checked>Salah pilih satuan (angka tetap)</label><label class="c"><input type="radio" name="md" value="konv">Konversi (angka dihitung ulang)</label>':''}<p class="pv" id="pv"></p>
 <label>Kondisi<select id="k">${J(['Baik','Rusak','Kedaluwarsa'].map(x=>`<option ${r&&r.kond===x?'selected':''}>${x}</option>`))}</select></label>
 ${i.exp?`<label>Tanggal kedaluwarsa<input id="x" type="date" value="${r?r.exp:''}"></label>`:''}
 <label>Catatan<input id="c" value="${e(r?r.cat:'')}"></label>
 <label>Foto bukti<input type="file" accept="image/*" capture="environment" data-c="foto"></label><img class="th" id="fp" ${r&&r.foto?`src="${r.foto}"`:'hidden'}>
 ${post?'<label>Alasan perubahan (wajib)<input id="al"></label><p class="m">Perubahan masuk audit log dan perlu persetujuan ulang.</p>':''}
 <button class="w p" data-a="save">Simpan</button>${r&&!post?'<button class="w d" style="margin-top:8px" data-a="del">Hapus baris</button>':''}`;render();pv()}
const pv=()=>{const p=$('#pv');if(!p||!$('#u'))return;const i=it(V.cur.id),q=+$('#q').value;p.textContent=q?`= ${fmt(q*F(i,$('#u').value))} ${i.dasar}`:''};
function tinjau(){const L=Object.values(S.ses).filter(s=>s.st!=='Draf').sort((a,b)=>b.tgl.localeCompare(a.tgl));
 return`<h2>Tinjau sesi</h2>${L.length?J(L.map(s=>{const big=Object.keys(s.rows).filter(id=>{const i=it(id),x=sel(s,id);return x&&i.stok&&Math.abs(x)/(i.stok||1)>.1}).length;return`<div class="card" style="border-left-color:${col(s.own)}" data-a="rv" data-v="${s.id}"><div class="row"><b>${dn(s.own)}${sf(s)}</b>${chip(s.st)}</div><div class="m">${s.lok} · ${s.tgl} · ${Object.keys(s.rows).length} item · oleh ${e(s.byn)}</div>${big?`<div class="m neg">${big} selisih besar</div>`:''}</div>`})):'<p class="m">Belum ada sesi yang dikirim.</p>'}`}
function review(s){const u=V.u,ok=s.st==='Dikirim'&&((u.r==='asisten'&&s.byr!=='asisten')||(u.r==='kepala'&&s.byr==='asisten'));
 return`<h3>${dn(s.own)} · ${s.lok}</h3><p class="m">${s.tgl} ${chip(s.st)} · ${e(s.byn)}</p><div class="wrap"><table><tr><th>Item</th><th>Fisik</th><th>Sistem</th><th>Selisih</th></tr>${J(Object.keys(s.rows).map(id=>{const i=it(id),r=s.rows[id],sy=s.st==='Terkunci'?r.sys:i.stok;return`<tr><td>${e(i.nama)}${r.cat?`<div class="m">${e(r.cat)}</div>`:''}${r.foto?`<img src="${r.foto}" width="48" style="border-radius:6px;display:block">`:''}</td><td>${r.q} ${r.u}</td><td>${fmt(sy)}</td><td>${sc(sel(s,id))}</td></tr>`}))}</table></div>
 ${s.rekon?`<p class="m"><b>Rekonsiliasi:</b> ${e(s.rekon)}</p>`:''}${s.verif?`<p class="m"><b>Diverifikasi:</b> ${e(s.verif)}</p>`:''}<p class="m">Selisih dalam satuan dasar item. Sesi pertama menjadi stok awal.</p>
 ${ok?`<button class="w p" data-a="ok" data-v="${s.id}">Setujui dan kunci</button><button class="w" style="margin-top:8px" data-a="ret" data-v="${s.id}">Kembalikan dengan catatan</button>`:''}
 ${u.r==='keu'?`<button class="w" data-a="rek" data-v="${s.id}">Catatan rekonsiliasi</button>`:''}${u.r==='gizi'?`<button class="w" data-a="ver" data-v="${s.id}">Verifikasi bahan pangan</button>`:''}
